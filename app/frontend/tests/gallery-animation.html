<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic card animation continuity</title><style>
body{margin:0}.gallery-viewport{height:500px;overflow:auto}.media-image{width:200px;height:200px;overflow:hidden}.media-image img{display:block;width:100%;height:100%;object-fit:contain}.spacer{height:600px}
</style></head><body><div id="app"></div><script type="module">
import {createApp,ref} from 'vue'
import GalleryCardImage from '../src/GalleryCardImage.vue'
const suspended=ref(false),mounted=ref(true);let timer
const onScroll=()=>{suspended.value=true;clearTimeout(timer);timer=setTimeout(()=>suspended.value=false,220)}
window.animationFixture={suspended,mounted,suspend:()=>{clearTimeout(timer);suspended.value=true},resume:()=>{clearTimeout(timer);suspended.value=false}}
createApp({components:{GalleryCardImage},setup(){return {suspended,mounted,onScroll}},template:`<div class="gallery-viewport" @scroll="onScroll"><GalleryCardImage v-if="mounted" label="clock" thumbnail="/synthetic-animation-thumb.png" preview="/synthetic-animation-clock.webp?first" previewStatus="ready" animation :suspended="suspended"/><div class="spacer"></div><GalleryCardImage label="new clock" thumbnail="/synthetic-animation-thumb.png" preview="/synthetic-animation-clock.webp?second" previewStatus="ready" animation :suspended="suspended"/><div class="spacer"></div></div>`}).mount('#app')
</script></body></html>
