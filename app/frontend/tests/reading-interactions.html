<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic reading interactions</title></head>
<body data-theme="dark"><main id="app"></main>
<script id="synthetic-api">
// Runs the real App, reader and image preparation code with tiny synthetic API
// responses. Holding a native Image's src controls only resource readiness.
const fixture = window.readingFixture = {requests: [], images: [], pending: new Map(), pendingErrors: new Map(), held: new Set(), failures: new Set(), generation: 1, expire: 0, bookmarkWrites: [], bookmarkFacts: new Map()}
const picture = id => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320"><rect width="240" height="320" fill="${id % 2 ? '#4f7a82' : '#95636f'}"/><text x="60" y="170" fill="white" font-size="32">${id}</text></svg>`)
const media = id => '/synthetic-reading/' + id + '.svg'
const nativeImage = window.Image, srcDescriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src')
window.Image = function() {
  const image = new nativeImage()
  let target = ''
  const remove = image.removeAttribute.bind(image)
  image.removeAttribute = name => { if (name === 'src') { fixture.pending.delete(target); fixture.pendingErrors.delete(target) }; return remove(name) }
  Object.defineProperty(image, 'src', {get: () => target, set(value) {
    target = value; fixture.images.push(value)
    const ready = () => { fixture.pending.delete(value); fixture.pendingErrors.delete(value); srcDescriptor.set.call(image, picture(Number(value.match(/(\d+)\.svg/)?.[1] || 1))) }
    if (fixture.failures.has(value)) queueMicrotask(() => image.onerror?.(new Event('error')))
    else if (fixture.held.has(value)) {
      fixture.pending.set(value, ready)
      fixture.pendingErrors.set(value, () => { fixture.pending.delete(value); fixture.pendingErrors.delete(value); image.onerror?.(new Event('error')) })
    }
    else srcDescriptor.set.call(image, value.startsWith('/synthetic-reading/') ? picture(Number(value.match(/(\d+)\.svg/)[1])) : value)
  }})
  return image
}
// If prepareImage adds a decode gate again this fixture never completes.
HTMLImageElement.prototype.decode = () => new Promise(() => {})
const bookmark = id => fixture.bookmarkFacts.get(id) || ({work_id:id, operation_id:null, status:'confirmed', desired:null, value:false, confirmed_at:'2026-10-20T00:00:00Z', error:null, version:1, cached:false, verified:true, fact_account_id:'synthetic', current_account_id:'synthetic', account_epoch:1})
const token = id => `work-${id}:${fixture.generation}`
const cards = Array.from({length:6}, (_,i) => ({id:i+1,pixiv_id:String(i+1),title:`合成作品 ${i+1}`,artist_id:1,artist_name:'合成画师',type:'illust',page_count:1,x_restrict:0,thumbnail:picture(i+1),preview:picture(i+1),preview_status:'ready',is_hidden:false,posted_at:null,bookmark:bookmark(i+1)}))
const nativeFetch = window.fetch
window.fetch = (target, options = {}) => {
  const request = new URL(String(target), location.href), path = request.pathname, params = request.searchParams
  if (!path.startsWith('/api/')) return nativeFetch(target, options)
  fixture.requests.push(path + request.search)
  const json = value => Promise.resolve(Response.json(value))
  if (path === '/api/startup') return json({state:'ready'})
  if (path === '/api/status') return json({page_size:100,pagination_mode:'pages'})
  if (path === '/api/progress') return json({operations:[],round:null,worker_error:null,catalogue_revision:fixture.generation,active_operation_count:0,automatic_paused:false})
  if (path === '/api/library/counts') return json({all:6,recent:0,favorites:0})
  if (path === '/api/library' || path === '/api/library/cursor') {
    const offset = Number(params.get('offset') || 0), limit = Number(params.get('limit') || 100)
    return json({items:cards.slice(offset,offset+limit).map(card => ({...card,cursor:token(card.id)})),total:6,offset,ceiling:6,as_of:'2026-10-20T00:00:00',generation:fixture.generation,catalogue_revision:fixture.generation,has_more:false,has_previous:offset>0})
  }
  if (path.endsWith('/cursor-neighbors')) {
    const id = Number(path.split('/')[3]), old = params.get('cursor')
    if (old && fixture.expire > 0) { fixture.expire--; return Promise.resolve(Response.json({detail:{code:'cursor_expired',message:'合成边界排序变化'}},{status:409})) }
    const neighbor = id => ({work_id:id,revision_id:null,page_count:1,cursor:token(id)})
    return json({anchor_cursor:token(id),generation:fixture.generation,continuation_rebased:!!old && old!==token(id),previous:id>1?neighbor(id-1):null,next:id<6?neighbor(id+1):null})
  }
  if (/^\/api\/works\/\d+$/.test(path)) {
    const id=Number(path.split('/')[3]), preview=id===2?picture(id):null
    return json({...cards[id-1],caption:'',caption_state:'empty',tags:[],rating:0,bookmark_count:0,view_count:0,display_page_count:1,pages:[{index:0,src:media(id),preview,width:240,height:320,state:'verified'}],assets:[],legacy_variants:[],catalogue_revision:fixture.generation})
  }
  if (path.startsWith('/api/bookmark-operations/')) {
    const id = Number(path.split('/').at(-1).split('-').at(-1))
    return json(bookmark(id))
  }
  if (path.includes('/bookmark')) {
    const id = Number(path.split('/')[3])
    if (path.endsWith('/refresh')) {
      const current = bookmark(id)
      const pending = {...current, operation_id:`refresh-${id}`, desired:null, kind:'refresh', status:'pending', version:current.version+1}
      if (current.version === 1) fixture.bookmarkFacts.set(id, pending)
    } else if (options.method === 'POST') {
      const request = JSON.parse(options.body)
      fixture.bookmarkWrites.push({id, ...request})
      fixture.bookmarkFacts.set(id, {...bookmark(id), operation_id:`write-${id}`, kind:'write',
        desired:request.desired, value:request.desired, status:'confirmed', version:bookmark(id).version+1})
    }
    return json(bookmark(id))
  }
  return json({items:[],total:0})
}
history.replaceState(null, '', '/')
</script>
<script type="module">
import {createApp} from 'vue'
import {createRouter,createWebHistory} from 'vue-router'
import App from '../src/App.vue'
import '../src/style.css'
createApp(App).use(createRouter({history:createWebHistory(),routes:[{path:'/:pathMatch(.*)*',component:App}]})).mount('#app')
</script></body></html>
