    works.forEach((w,i)=>w.artist=artistNames[i%artistNames.length]);
    function avatarSvg(index){
      const colors=[['#b6d5eb','#3d6d94','#f2cfb4'],['#d8b5c7','#684e75','#efc8aa'],['#bad8c7','#406b61','#f1cfad'],['#aabbd8','#334c70','#e8bea9']][index];

function persist(){

function queryKey(){return JSON.stringify([search,rail,sort,filter]);}
function matchedWorks(f=filter){
  let list=works.filter(w=>(w.title+w.artist).toLowerCase().includes(search.toLowerCase()));
  list=list.filter(w=>f.artists.includes(w.artist)&&f.types.includes(workType(w)));
  if(f.tags.length)list=list.filter(w=>f.tags.includes(workTag(w)));
  if(!f.showHidden)list=list.filter(w=>!hiddenWorks.has(w.id));
  if(rail==='收藏')list=list.filter(w=>favorites.has(w.id));
  if(rail==='最近存入')list=list.filter(w=>w.id<=8);
  if(f.period==='day')list=list.filter(w=>w.id<=4);
  if(f.period==='week')list=list.filter(w=>w.id<=8);
  if(f.period==='month')list=list.filter(w=>w.id<=10);
  if(f.period==='custom')list=list.filter(w=>(!f.from||workDate(w)>=f.from)&&(!f.to||workDate(w)<=f.to));
  if(sort==='old')list.reverse();
  if(sort==='name')list.sort((a,b)=>a.title.localeCompare(b.title,'zh-CN'));
  return list;
}
function filterSummary(f=filter){
  const parts=[];
  if(f.artists.length!==artists.length)parts.push(f.artists.length===1?f.artists[0]:f.artists.length+' 位画师');
  if(f.types.length!==types.length)parts.push(f.types.join('、')||'未选类型');
  if(f.tags.length)parts.push(f.tags.join('、'));
  if(f.period!=='all')parts.push({day:'24 小时内',week:'一周内',month:'一月内',custom:'指定期间'}[f.period]);
  if(f.showHidden)parts.push('含隐藏作品');
  return parts.length?parts.join(' · '):'全部画师 · 全部类型';
}

function resultsHtml(){

 const w=works[selected],list=readSequence(),at=list.findIndex(x=>x.id===w.id),count=pageCount(w);

"><div><h2>端口设置</h2><p>当前使用 '+activePort+'。保存后需要重启程序才会使用新端口。</p></div><div class="settings-controls"><input id="portValue" type="number" min="1024" max="65535" step="1" value="'+pendingPort+'" aria-label="端口"><button class="primarybtn" data-action="save-port">保存</button></div><p id="portFeedback" class="setting-feedback" role="status">'+(pendingPort!==activePort?'已保存 '+pendingPort+'，等待重启；当前地址仍使用 '+activePort+'。':'默认端口为 1919。')+'</p></section><section class="settings-card settings-stack"><div><h2>当前访问地址</h2><p>手机与电脑连接同一局域网即可访问。</p></div><div class="address-row"><span>这台电脑</span><code>http://localhost:'+activePort+'</code></div><div class="address-row"><span>手机访问</span><code>http://电脑的局域网地址:'+activePort+'</code></div></section></main>';

function render(){
 themeTransition?.skipTransition();
 document.body.dataset.theme=theme;
 document.getElementById('app').innerHTML=topbar()+({gallery,detail,stream,artists:artistsPage,settings:settingsPage}[view])();
}

function topEdge(){return document.querySelector('.topbar')?.getBoundingClientRect().bottom||64;}
function capturePosition(){
 const y=window.scrollY;
 if(view==='artists'){
  artistScroll=y;
  document.querySelectorAll('[data-strip]').forEach(el=>artistStrips[el.dataset.strip]=el.scrollLeft);
  return {y,artistStrips:{...artistStrips}};
 }
 let nodes;
 if(view==='gallery')nodes=[...document.querySelectorAll('[data-card]')];
 else if(view==='detail'||view==='stream')nodes=[...document.querySelectorAll('.'+view+'-page')];
 else return {y};
 const first=nodes.find(el=>el.getBoundingClientRect().bottom>topEdge()+4)||nodes.at(-1);
 if(!first||y<2)return {y:0,page:galleryPage};
 const r=first.getBoundingClientRect();
 return {y,work:Number(first.dataset.card||first.dataset.work),page:view==='gallery'?galleryPage:Number(first.dataset.page),fraction:(topEdge()+8-r.top)/Math.max(1,r.height)};
}
function rememberPosition(){
 if(isRestoring||filterDraft||zoom)return;
 const pos=capturePosition();
 if(view==='gallery'||view==='stream')positions[view+':'+queryKey()]=pos;
 if(view==='detail')detailPositions[works[selected].id]=pos;
 updateReader();
 clearTimeout(persistTimer);persistTimer=setTimeout(persist,220);
}
function updateReader(){
 if(view!=='stream'&&view!=='detail')return;
 const line=topEdge()+Math.min(130,(innerHeight-topEdge()-74)*.25);
 const pages=[...document.querySelectorAll('.'+view+'-page')];
 const current=pages.find(el=>el.getBoundingClientRect().bottom>line)||pages.at(-1);
 if(!current)return;
 const w=byId(current.dataset.work),page=Number(current.dataset.page)+1;
 if(view==='stream'){
  selected=works.indexOf(w);
  const list=streamReadIds.map(byId),at=list.findIndex(x=>x.id===w.id),last=at===list.length-1;
  const title=document.getElementById('streamCurrentTitle'),position=document.getElementById('streamPosition'),skip=document.getElementById('streamSkip');
  title.textContent=w.title;position.textContent=(at+1)+' / '+list.length+' · 第 '+page+' / '+pageCount(w)+' 页';
  const favorite=document.getElementById('streamFavorite'),on=favorites.has(w.id);
  favorite.dataset.heart=String(w.id);favorite.classList.toggle('on',on);
  favorite.setAttribute('aria-pressed',String(on));
  favorite.setAttribute('aria-label',(on?'取消收藏 ':'收藏 ')+w.title);
  skip.disabled=last||isNavigating;skip.dataset.current=String(w.id);
  skip.innerHTML=last?'最后一件':'跳过作品'+I('down');
 }else{
  const at=readIds.indexOf(w.id);
  document.getElementById('detailPosition').textContent=(at+1)+' / '+readIds.length+' · 第 '+page+' / '+pageCount(w)+' 页';
 }
}
function restorePosition(pos={y:0},then){
 const epoch=navigationEpoch;
 isRestoring=true;
 requestAnimationFrame(()=>{
  if(epoch!==navigationEpoch)return;
  let target=null;
  if(pos.work){
   if(view==='gallery')target=document.querySelector('[data-card="'+pos.work+'"]');
   else target=document.querySelector('.'+view+'-page[data-work="'+pos.work+'"][data-page="'+(pos.page||0)+'"]');
  }
  const y=target?window.scrollY+target.getBoundingClientRect().top-topEdge()-8+(pos.fraction||0)*target.getBoundingClientRect().height:pos.y||0;
  window.scrollTo({top:Math.max(0,y),behavior:'instant'});
  if(view==='artists')document.querySelectorAll('[data-strip]').forEach(el=>el.scrollLeft=(pos.artistStrips||artistStrips)[el.dataset.strip]||0);
  requestAnimationFrame(()=>{if(epoch!==navigationEpoch)return;isRestoring=false;updateReader();if(then)then();});
 });
}
function snapshot(){
 return {prototype:true,view,selected,filter:clone(filter),search,rail,sort,galleryPage,readIds:[...readIds],detailOrigin,position:capturePosition()};
}
function saveHistory(){history.replaceState(snapshot(),'');}
function bookmarkReaderInGallery(){
 if(!['detail','stream'].includes(view))return;
 updateReader();
 const list=matchedWorks(),w=works[selected],at=list.findIndex(x=>x.id===w.id);
 if(at>=0)positions['gallery:'+queryKey()]={work:w.id,page:Math.floor(at/pageSize)+1,fraction:0,y:0};
}
function galleryPageForPosition(pos){
 const at=pos.work?matchedWorks().findIndex(w=>w.id===pos.work):-1;
 return at>=0?Math.floor(at/pageSize)+1:pos.page||1;
}
function navigate(v,options={}){
 if(v===view&&!options.force)return;
 navigationEpoch++;isNavigating=false;
 if(!options.sourceSaved){rememberPosition();bookmarkReaderInGallery();saveHistory();}
 view=v;
 let pos=options.position;
 if(!pos){
  if(v==='gallery'||v==='stream')pos=positions[v+':'+queryKey()]||{y:0};
  else if(v==='artists')pos={y:artistScroll,artistStrips};
  else if(v==='detail')pos=detailPositions[works[selected].id]||{y:0};
  else pos={y:0};
 }
 if(v==='gallery'&&galleryMode==='页码翻页')galleryPage=galleryPageForPosition(pos);
 isRestoring=true;render();
 restorePosition(pos,()=>{
  history.pushState(snapshot(),'');
  persist();
 });
}
function goHome(){if(filterDraft)closeFilter();if(view!=='gallery')navigate('gallery');}
function openDetail(id){
 const w=byId(id);if(!w)return;
 navigationEpoch++;isNavigating=false;
 const origin=view;
 rememberPosition();saveHistory();
 if(origin==='artists')readIds=works.filter(x=>x.artist===w.artist&&!hiddenWorks.has(x.id)).map(x=>x.id);
 else readIds=origin==='stream'?[...streamReadIds]:matchedWorks().map(x=>x.id);
 if(!readIds.includes(w.id))readIds=[w.id];
 detailOrigin=['gallery','stream','artists'].includes(origin)?origin:'gallery';
 selected=works.indexOf(w);
 // Set the new work only after the source page's position is captured.
 view='detail';isRestoring=true;render();
 restorePosition(detailPositions[w.id]||{y:0},()=>history.pushState(snapshot(),''));
}
async function nextDetail(step){
 if(isNavigating||filterDraft||zoom)return;
 const at=readIds.indexOf(works[selected].id),id=readIds[at+step],w=byId(id);if(!w)return;
 const epoch=navigationEpoch;
 isNavigating=true;rememberPosition();
 try{
  const img=new Image();img.src=w.img;await img.decode();
  if(epoch!==navigationEpoch||view!=='detail')return;
  if(filterDraft||zoom){isNavigating=false;return;}
  selected=works.indexOf(w);bookmarkReaderInGallery();render();
  restorePosition({y:0},()=>{
   if(!reduceMotion())document.querySelector('.detail')?.animate([{opacity:.65},{opacity:1}],{duration:160});
   isNavigating=false;saveHistory();
  });
 }catch(_){if(epoch===navigationEpoch){isNavigating=false;showToast('图片暂时无法打开，可以再次点击重试。');}}
}
async function skipWork(){
 if(isNavigating||view!=='stream')return;
 updateReader();
 const list=streamReadIds.map(byId),at=list.findIndex(w=>w.id===works[selected].id),w=list[at+1];if(!w)return;
 const epoch=navigationEpoch;
 isNavigating=true;updateReader();
 try{
  const img=new Image();img.src=w.img;await img.decode();
  if(epoch!==navigationEpoch||view!=='stream')return;
  if(filterDraft||zoom){isNavigating=false;updateReader();return;}
  const target=document.getElementById('stream-'+w.id);
  window.scrollTo({top:window.scrollY+target.getBoundingClientRect().top-topEdge()-8,behavior:'instant'});
  if(!reduceMotion())target.animate([{opacity:.55},{opacity:1}],{duration:170});
  selected=works.indexOf(w);
  requestAnimationFrame(()=>{if(epoch!==navigationEpoch)return;isNavigating=false;rememberPosition();saveHistory();});
 }catch(_){if(epoch===navigationEpoch){isNavigating=false;updateReader();showToast('下一件暂时无法打开，请重试。');}}
}
function updateResults(reset=false){
 if(view!=='gallery')return;
 if(reset)galleryPage=1;
 document.getElementById('galleryResults').innerHTML=resultsHtml();
 if(reset)positions['gallery:'+queryKey()]={y:0,page:1};
 persist();
}
function changeScope(label){
 rememberPosition();saveHistory();
 rail=label;galleryPage=1;
 navigate('gallery',{position:positions['gallery:'+queryKey()]||{y:0},force:true,sourceSaved:true});
 persist();
}
function showArtist(name){
 rememberPosition();saveHistory();
 filter={...defaults(),artists:[name]};rail='全部作品';search='';galleryPage=1;
 navigate('gallery',{position:{y:0},force:true,sourceSaved:true});
}
function toggleFavorite(id){
 const w=byId(id),on=!favorites.has(id);
 if(on)favorites.add(id);else favorites.delete(id);
 // Update the clicked control without replacing its containing card, image or focused node.
 document.querySelectorAll('[data-heart="'+id+'"]').forEach(b=>{
