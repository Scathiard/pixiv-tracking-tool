<html lang="zh-CN">

  <title>PixivTracker · 阅览界面样稿</title>
  <!-- Single local-first visual prototype with a settings-controlled light/dark theme. No real library or account connection. -->
  <style>
    :root{font-family:'DM Sans','Noto Sans SC',system-ui,sans-serif;font-synthesis:none;scroll-behavior:smooth}

    body[data-theme=dark]{--bg:#101820;--surface:#19242f;--surface2:#243448;--text:#f5f8fc;--muted:#9eafc0;--line:#304153;--accent:#0096fa;--accent-text:#fff;--art-bg:#222f3b}

    body{background:var(--bg);color:var(--text)} .app{min-height:100vh;padding-bottom:24px} .icon{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

    .brand{display:flex;align-items:center;gap:12px;white-space:nowrap;font-size:19px;letter-spacing:-.05em;font-weight:700}.brandmark{height:28px;width:28px;display:grid;place-items:center;border:1.5px solid var(--accent);border-radius:8px;color:var(--accent);font-family:Georgia,serif;font-size:21px;font-weight:400;letter-spacing:-.2em;padding-right:5px;transform:rotate(-5deg)}.brand small{font-size:10px;letter-spacing:.16em;opacity:.65;font-weight:600;margin-left:4px;text-transform:uppercase}
    .topnav{display:flex;align-items:center;gap:5px;margin-left:auto}.navbtn,.iconbtn,.softbtn,.plainbtn{border:0;color:var(--muted);background:transparent}.navbtn{min-height:39px;padding:9px 17px;border-radius:999px;font-size:13px;font-weight:600}.navbtn.active{background:var(--surface2);color:var(--text)}.navbtn:hover,.iconbtn:hover,.softbtn:hover{color:var(--text)}.toptools{display:flex;gap:10px;align-items:center;border-left:1px solid var(--line);padding-left:18px}.taskchip{border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);display:flex;gap:8px;align-items:center;padding:8px 12px;font-size:12px;white-space:nowrap}.taskchip .dot{width:7px;height:7px;border-radius:50%;background:#70aa8c}.iconbtn{height:38px;width:38px;border-radius:50%;display:grid;place-items:center}
    .demo-note{position:fixed;bottom:18px;left:18px;z-index:70;background:#171e22e8;color:#fff;border:1px solid #70828b70;border-radius:9px;padding:7px 10px;font-size:10px;letter-spacing:.03em;pointer-events:none}
    .art{width:100%;height:100%;object-fit:cover;background:var(--art-bg)}.thumb{position:relative;overflow:hidden;background:var(--art-bg)}.thumb img{transition:transform .45s cubic-bezier(.2,.6,.2,1)}.card:hover .thumb img{transform:scale(1.045)}.badge{position:absolute;top:12px;right:12px;background:#10191dba;color:#fff;border:1px solid #ffffff55;border-radius:5px;font-size:11px;font-weight:700;padding:5px 7px;backdrop-filter:blur(8px)}.card-title{font-size:13px;font-weight:650;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:11px;color:var(--muted);line-height:1.5}.heart{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:4px 3px}.heart.on{color:#d67e79}.heart:hover{transform:scale(1.08)}.card{cursor:pointer;min-width:0}.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px;border-radius:9px;min-width:210px;height:39px}.search input{min-width:0;width:100%;border:0;outline:0;color:var(--text);background:transparent;font-size:12px}.search input::placeholder{color:var(--muted)}select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:9px;height:39px;padding:0 11px;font-size:12px}.softbtn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:12px;white-space:nowrap}.softbtn.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}.muted{color:var(--muted)}.panel{background:var(--surface);border:1px solid var(--line)}
    .gallery{min-height:calc(100vh - 72px)}
    /* A: image-first dark gallery with a narrow library rail and quiet captions. */
    .gallery{display:grid;grid-template-columns:226px minmax(0,1fr)}.gallery-rail{display:block;border-right:1px solid var(--line);padding:36px 22px;position:sticky;top:72px;height:calc(100vh - 72px)}.rail-overline{font-size:10px;color:var(--accent);letter-spacing:.18em;font-weight:700;text-transform:uppercase;margin-bottom:21px}.rail-links{display:flex;flex-direction:column;gap:5px}.rail-link{background:transparent;border:0;color:var(--muted);text-align:left;padding:11px 12px;border-radius:8px;font-size:13px;display:flex;justify-content:space-between}.rail-link.active{background:var(--surface2);color:var(--text)}.rail-link span{font-size:11px;opacity:.55}.rail-note{border-top:1px solid var(--line);padding-top:22px;margin-top:30px;font-size:12px;color:var(--muted);line-height:1.6}.rail-note strong{display:block;color:var(--text);font-size:28px;letter-spacing:-.07em;line-height:1.1;margin-top:4px}.gallery-main{padding:42px clamp(26px,3.5vw,60px)}.gallery-intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}.gallery-title{font-family:Georgia,'Noto Sans SC',serif;font-size:40px;font-weight:400;letter-spacing:-.045em;line-height:1.15;margin:8px 0 7px}.gallery-intro p{color:var(--muted);font-size:12px;margin:0}.filters{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.filter-left,.filter-right{display:flex;gap:8px;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:29px 16px}.thumb{aspect-ratio:1/1.15;border-radius:7px}.card-meta{display:flex;justify-content:space-between;align-items:start;padding-top:10px;gap:6px}.card-meta > div{min-width:0}.artist{margin-top:2px}
    .gallery-number{display:none}
    .empty{grid-column:1/-1;color:var(--muted);padding:80px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px}
    .stream{min-height:100vh}.stream-head{max-width:820px;margin:0 auto;padding:28px 20px 22px;display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line)}.stream-head h1{font-family:Georgia,'Noto Sans SC',serif;font-weight:400;margin:5px 0 0;font-size:27px}.stream-list{max-width:820px;margin:0 auto}.stream-item{padding:28px 20px 48px;border-bottom:1px solid var(--line)}.stream-label{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:11px;margin-bottom:15px}.stream-label b{color:var(--text);font-weight:600}.stream-figure{max-width:690px;margin:auto}.stream-figure img{width:100%;max-height:80vh;object-fit:contain;background:var(--art-bg);border-radius:4px}.stream-figure img+img{margin-top:9px}.stream-footer{max-width:690px;margin:13px auto 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.stream-footer h2{font-family:Georgia,'Noto Sans SC',serif;font-size:16px;font-weight:400;margin:0 0 3px}.stream-footer p{font-size:11px;color:var(--muted);margin:0}.stream-footer button{background:none;border:1px solid var(--line);color:var(--muted);font-size:11px;border-radius:7px;padding:8px 11px}.stream-footer button:hover{color:var(--text)}
    @media(max-width:1050px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.brand small{display:none}}
    @media(max-width:760px){.app{padding-bottom:24px}.topbar{height:58px;padding:0 10px;gap:4px}.brand{font-size:14px;gap:4px}.brandmark{width:21px;height:21px;font-size:15px;border-radius:5px}.topnav{margin-left:auto;gap:1px}.navbtn{font-size:10px;padding:6px 5px;min-height:30px;border-radius:6px}.demo-note{display:none}
      .gallery{display:block}.gallery-rail{display:none}.gallery-main{padding:25px 14px}.gallery-title{font-size:30px}.gallery-intro{margin-bottom:18px;padding-bottom:0;border:0}.filters{flex-wrap:wrap;gap:8px}.filter-left{width:100%}.search{width:100%;height:40px}.filter-right{width:100%;justify-content:space-between}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px}.badge{top:7px;right:7px;font-size:9px;padding:4px 5px}.heart{font-size:18px}.card-title{font-size:11px!important}.artist{font-size:10px}.stream-head{padding:23px 14px 17px}.stream-head h1{font-size:23px}.stream-item{padding:21px 0 34px}.stream-label,.stream-footer{padding:0 14px}.stream-figure img{border-radius:0}.stream-footer h2{font-size:14px}}
    /* Both layouts share one unmistakable Pixiv-blue interaction language. */
    .topbar{box-shadow:inset 0 3px var(--accent)}
    .brandmark{background:var(--accent);border-color:var(--accent);color:#fff;transform:none;font-family:system-ui,sans-serif;font-size:18px;font-weight:800;padding-right:0;letter-spacing:-.08em}
    .brand-word span{color:var(--accent)}
    .navbtn.active{background:var(--accent);color:#fff;box-shadow:0 3px 13px color-mix(in srgb,var(--accent) 30%,transparent)}
    .navbtn.active:hover{color:#fff}
    .rail-link.active{background:color-mix(in srgb,var(--accent) 15%,var(--surface));color:var(--accent);box-shadow:inset 3px 0 var(--accent)}
    .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
    .softbtn:hover{border-color:var(--accent);color:var(--accent)}
    .softbtn.active:hover{color:#fff}
    .badge{background:#008ce8e8;border-color:#ffffff48}
    .card:hover .thumb{box-shadow:0 0 0 2px var(--accent)}
    .stream-footer button:hover{border-color:var(--accent);color:var(--accent)}
    .taskchip:hover{border-color:var(--accent);color:var(--accent)}
    .brand{border:0;background:none;color:var(--text);padding:0;text-align:left;cursor:pointer}
    .brand:hover .brand-word{opacity:.84}
    .toptools,.taskchip,.iconbtn{display:none}
    .filter-summary-line{display:flex;justify-content:space-between;gap:12px;margin:-5px 0 17px;color:var(--muted);font-size:11px}
    .filter-summary-line span{white-space:nowrap}
    .filter-open{display:inline-flex;align-items:center;gap:5px}
    .filter-open .icon{height:15px;width:15px}
    .detail{max-width:1160px;margin:0 auto;padding:27px 26px 130px}
    .detail-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px;color:var(--muted);font-size:12px}
    .detail-nav>div{display:flex;align-items:center;gap:14px}
    .detail-back{border:0;background:none;color:var(--muted);padding:5px 0;font-size:13px}
    .detail-back:hover,.text-link:hover{color:var(--accent)}
    .detail-head{margin-bottom:21px}
    .detail-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
    .detail-title-row h1{font-family:Georgia,'Noto Sans SC',serif;font-size:24px;font-weight:500;margin:0 4px 0 0;line-height:1.45}
    .detail-badge{background:var(--accent);color:#fff;font-size:10px;padding:3px 6px;border-radius:4px;font-weight:700;white-space:nowrap}
    .detail-meta{display:flex;align-items:center;flex-wrap:wrap;gap:7px 15px;color:var(--muted);font-size:12px}
    .text-link{border:0;background:none;color:var(--accent);padding:0;font-size:inherit}
    .detail-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
    .tag{border:1px solid var(--line);background:var(--surface);border-radius:999px;color:var(--muted);padding:4px 10px;font-size:11px}
    .tag:hover{border-color:var(--accent);color:var(--accent)}
    .detail-actions{display:flex;align-items:center;gap:10px;padding:0 0 15px;margin-bottom:17px;border-bottom:1px solid var(--line);font-size:12px}
    .detail-action-right{display:flex;gap:8px;margin-left:auto}
    .detail-pages{display:flex;flex-direction:column;gap:12px}
    .detail-page{background:var(--surface);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;align-items:center}
    .detail-page img{display:block;max-width:100%;width:auto;height:min(77vh,840px);object-fit:contain}
    .page-num{width:100%;text-align:center;background:var(--surface2);padding:7px;color:var(--muted);font-size:11px}
    .detail-bottom-nav{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 0;color:var(--muted);font-size:12px}
    .detail-bottom-nav button{height:39px;width:43px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:7px}
    .detail-bottom-nav button:hover{border-color:var(--accent);color:var(--accent)}
    .detail-caption{max-width:800px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:17px 20px;color:var(--muted);line-height:1.8;font-size:12px;margin:0}
    .detail-side{position:fixed;inset:17% 0 auto;display:flex;justify-content:space-between;pointer-events:none;z-index:50}
    .detail-side button{height:62vh;width:25px;border:0;background:color-mix(in srgb,var(--surface) 66%,transparent);color:var(--muted);font-size:19px;pointer-events:auto;opacity:.55}
    .detail-side button:hover{background:color-mix(in srgb,var(--accent) 35%,transparent);color:#fff;opacity:1}
    .filter-overlay{position:fixed;inset:0;background:#02070b9c;display:flex;justify-content:flex-end;z-index:130}
    .filter-panel{height:100%;width:370px;max-width:92vw;background:var(--bg);border-left:1px solid var(--line);padding:23px;overflow-y:auto;box-shadow:-15px 0 40px #0005}
    .filter-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .filter-panel-head strong{font-size:17px}.filter-panel-head button{border:0;background:none;color:var(--muted);font-size:24px;line-height:1}
    .filter-panel-summary{color:var(--muted);font-size:11px;line-height:1.6;margin:0 0 17px}
    .filter-section{border-bottom:1px solid var(--line)}
    .filter-section-title{width:100%;padding:15px 0;border:0;background:none;color:var(--text);text-align:left;font-weight:600;font-size:13px;display:flex;justify-content:space-between}
    .filter-section-title::after{content:'▸';font-size:13px;color:var(--muted)}
    .filter-section-title.open::after{content:'▾';color:var(--accent)}
    .filter-section-body{padding:0 0 17px}
    .filter-chips{display:flex;flex-wrap:wrap;gap:7px}
    .filter-chip{border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);padding:6px 11px;font-size:11px}
    .filter-chip.active{border-color:var(--accent);background:var(--accent);color:#fff}
    .filter-chip:hover:not(.active){border-color:var(--accent);color:var(--accent)}
    .filter-dates{display:flex;align-items:center;gap:6px;margin-top:13px}.filter-dates input{min-width:0;width:46%;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px;font-size:11px}
    .filter-check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.filter-check input{accent-color:var(--accent)}
    .filter-panel-foot{position:sticky;bottom:-23px;background:var(--bg);padding:20px 0 23px;display:flex;gap:8px}.filter-panel-foot button{flex:1}
    .primarybtn{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:8px;padding:10px 15px;font-size:12px;font-weight:700;white-space:nowrap}
    .primarybtn:hover{filter:brightness(1.1)}
    .settings-page,.subpage{max-width:1050px;margin:0 auto;padding:42px 28px 140px}
    .settings-title{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:24px}
    .settings-title h1,.subpage h1{font-family:Georgia,'Noto Sans SC',serif;font-size:35px;font-weight:500;margin:8px 0 0}
    .settings-title span{color:var(--muted);font-size:11px}
    .settings-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:24px}
    .settings-stats>div{background:var(--surface);border:1px solid var(--line);padding:19px 20px;border-radius:9px}
    .settings-stats strong{display:block;color:var(--accent);font-family:Georgia,serif;font-size:29px;font-weight:500;line-height:1.1}
    .settings-stats span{display:block;color:var(--muted);font-size:11px;margin-top:7px}
    .settings-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:21px 22px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:25px}
    .settings-card h2{font-size:15px;margin:0 0 7px;font-weight:700}.settings-card p{color:var(--muted);font-size:12px;line-height:1.65;margin:0}
    .settings-stack{display:block}.settings-stack>div:first-child{margin-bottom:15px}
    .path-display{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-size:12px;display:flex;justify-content:space-between;gap:10px}
    .path-display span{color:var(--muted);font-size:10px}.path-structure{font-size:11px;color:var(--muted);padding:13px 0}.path-structure code,.address-row code{color:var(--accent)}
    .settings-controls{display:flex;gap:8px;align-items:center}.settings-controls input{width:110px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 11px;font-size:12px}
    .address-row{border-top:1px solid var(--line);padding:10px 0;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
    .sublead{font-size:12px;color:var(--muted)}
    .task-progress{position:fixed;z-index:90;top:84px;right:24px;width:315px;max-width:calc(100vw - 28px);background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:13px 15px;box-shadow:0 16px 40px #0006}
    .task-progress-top{display:flex;justify-content:space-between;gap:12px;font-size:12px}.task-progress-top b{color:var(--accent)}
    .task-progress-track{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:11px 0 7px}.task-progress-track>div{height:100%;width:0;background:var(--accent);transition:width .2s}
    .task-progress small{color:var(--muted);font-size:10px}.toast{position:fixed;z-index:140;left:50%;bottom:20px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);color:var(--text);padding:10px 15px;border-radius:9px;box-shadow:0 10px 30px #0005;font-size:12px;white-space:nowrap;max-width:94vw}
    .card{scroll-margin-top:92px}
    .settings-page,.subpage{padding-bottom:60px}
    .detail{padding-bottom:60px}
    .theme-choices{display:flex;gap:8px}
    .theme-choice{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 16px;font-size:12px;min-width:82px}
    .theme-choice.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
    .artists-toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
    .artists-toolbar h1{margin:7px 0 5px}
    .artist-layout-switch{display:flex;gap:5px;background:var(--surface);padding:4px;border:1px solid var(--line);border-radius:10px;white-space:nowrap}
    .artist-layout-switch button{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:8px 13px;font-size:12px}
    .artist-layout-switch button.active{background:var(--accent);color:#fff}
    .artists-list{display:grid;gap:15px}
    .artists-list.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .artists-list.row{grid-template-columns:1fr}
    .artist-profile{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:18px;min-width:0}
    .artist-profile:hover{border-color:color-mix(in srgb,var(--accent) 54%,var(--line))}
    .artist-identity{min-width:0}
    .artist-profile-head{display:flex;align-items:center;gap:12px}
    .artist-avatar{height:60px;width:60px;flex:none;border-radius:50%;object-fit:cover;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
    .artist-profile-head h2{font-size:16px;margin:0 0 4px}
    .artist-profile-head small{color:var(--muted);font-size:10px}
    .artist-bio{color:var(--muted);font-size:12px;line-height:1.7;margin:12px 0 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .artist-open{border:0;background:none;color:var(--accent);padding:0;font-size:11px}
    .artist-workarea{min-width:0}
    .artist-workbar{display:flex;align-items:center;justify-content:space-between;gap:7px;margin:0 0 10px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
    .strip-nav{display:flex;gap:5px}
    .strip-nav button{background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--muted);width:26px;height:24px;line-height:1}
    .strip-nav button:hover{border-color:var(--accent);color:var(--accent)}
    .artist-recent-strip{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--line) transparent;cursor:grab;touch-action:pan-x;padding-bottom:4px}

<body data-theme="dark">

  <script>
    const works=[

      {id:5,title:'蓝色半日',artist:'Lin',type:'',palette:['#6fadd0','#d2e8e3','#f5d2a7','#3e6680'],kind:'sun',ratio:'landscape'},

      {id:8,title:'远处有灯',artist:'soru',type:'2 页',palette:['#292c52','#795b79','#e0a78c','#6d83a3'],kind:'city',ratio:'landscape'},
      {id:9,title:'白色噪声',artist:'夜壶',type:'',palette:['#a6bfd0','#dce4df','#728b97','#436273'],kind:'sea',ratio:'portrait'},
      {id:10,title:'雨季的颜色',artist:'ruo',type:'3 页',palette:['#86a6a3','#cbd0ad','#f2c3aa','#415b63'],kind:'flowers',ratio:'portrait'},
      {id:11,title:'凌晨四点的天空',artist:'koto',type:'',palette:['#4b5a83','#ab8ca6','#eec9a6','#243550'],kind:'sun',ratio:'landscape'},
      {id:12,title:'午后的秘密基地',artist:'千屿',type:'',palette:['#d2ad87','#f4e1ba','#8caaa3','#6a716e'],kind:'room',ratio:'portrait'}
    ];

      const defs=`<defs><linearGradient id="sky" x2=".25" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><linearGradient id="ground" x2="1" y2="1"><stop stop-color="${c}"/><stop offset="1" stop-color="${d}"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="22"/></filter></defs>`;

      if(w.kind==='sea') inner=`<circle cx="580" cy="249" r="145" fill="${b}" opacity=".75"/><path d="M0 531 Q170 509 335 523 T800 498V1000H0Z" fill="${d}"/><path d="M0 630 Q159 597 301 619 T800 590" fill="none" stroke="${c}" stroke-width="15" opacity=".8"/><path d="M0 702Q210 675 420 704T800 665M0 795Q150 765 341 788T800 744" fill="none" stroke="${a}" stroke-width="11" opacity=".65"/><path d="M95 519 L167 419 L235 512 M332 518 L438 373 L533 512" fill="${c}" opacity=".8"/><path d="M0 903 Q340 783 800 886 V1000 H0" fill="${b}" opacity=".55"/>`;
      if(w.kind==='flowers') inner=`<path d="M0 671 Q209 487 381 634 T800 580 V1000H0Z" fill="${c}" opacity=".75"/><path d="M0 792 Q185 643 377 728 T800 667 V1000H0Z" fill="${d}"/><g stroke="${d}" stroke-width="8" fill="none"><path d="M158 997Q190 619 125 382M360 998Q383 509 471 262M636 1000Q570 620 658 363M526 1000Q525 759 434 589"/></g><g fill="${b}"><ellipse cx="125" cy="360" rx="55" ry="100" transform="rotate(-28 125 360)"/><ellipse cx="171" cy="363" rx="55" ry="96" transform="rotate(30 171 363)"/><ellipse cx="470" cy="250" rx="66" ry="111" transform="rotate(-26 470 250)"/><ellipse cx="529" cy="260" rx="57" ry="100" transform="rotate(28 529 260)"/><ellipse cx="660" cy="348" rx="59" ry="100" transform="rotate(28 660 348)"/></g><g fill="${a}"><circle cx="150" cy="393" r="47"/><circle cx="493" cy="292" r="55"/><circle cx="642" cy="394" r="47"/></g><g fill="#fff" opacity=".65"><circle cx="150" cy="390" r="13"/><circle cx="492" cy="289" r="16"/><circle cx="644" cy="391" r="13"/></g>`;
      if(w.kind==='city') inner=`<circle cx="591" cy="223" r="107" fill="${c}" opacity=".7" filter="url(#blur)"/><circle cx="591" cy="223" r="77" fill="${c}"/><path d="M0 586L94 586V420H217V559H303V309H419V587H514V473H623V373H745V557H800V1000H0Z" fill="${d}"/><path d="M0 648H800V1000H0Z" fill="${c}" opacity=".23"/><g fill="${b}" opacity=".82"><rect x="120" y="463" width="25" height="30"/><rect x="162" y="463" width="25" height="30"/><rect x="334" y="351" width="29" height="37"/><rect x="379" y="351" width="29" height="37"/><rect x="334" y="416" width="29" height="37"/><rect x="379" y="416" width="29" height="37"/><rect x="657" y="421" width="28" height="35"/><rect x="704" y="421" width="28" height="35"/></g><path d="M0 713Q317 655 800 733M0 803Q298 734 800 839" fill="none" stroke="${a}" stroke-width="13" opacity=".6"/><path d="M342 1000L421 680L486 1000" fill="${d}" opacity=".55"/>`;
      if(w.kind==='room') inner=`<path d="M0 0H800V1000H0Z" fill="${b}"/><path d="M0 0H518V644H0Z" fill="${c}"/><path d="M40 39H476V603H40Z" fill="url(#sky)"/><circle cx="296" cy="223" r="95" fill="#fff4d9" opacity=".8"/><path d="M40 479Q195 358 311 474T476 423V603H40Z" fill="${d}" opacity=".8"/><path d="M518 0H800V1000H518Z" fill="${a}"/><path d="M0 663H800V1000H0Z" fill="${d}"/><path d="M110 681L602 639L784 728L219 795Z" fill="${b}"/><path d="M205 793V1000M730 750V1000" stroke="${a}" stroke-width="24"/><path d="M73 0V664M506 0V657" stroke="${b}" stroke-width="20"/><path d="M250 574Q290 438 351 449M290 608Q257 478 175 480" stroke="${c}" stroke-width="18" fill="none"/><circle cx="339" cy="452" r="32" fill="${a}"/>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">${defs}<rect width="800" height="1000" fill="url(#sky)"/>${inner}<path d="M0 0H800V1000H0Z" fill="none" stroke="#ffffff" stroke-width="16" opacity=".06"/></svg>`)}`;
    }
    works.forEach(w=>w.img=artSvg(w));
    const artistNames=['空庭','南方通信','asako','逆光收集者'];
    works.forEach((w,i)=>w.artist=artistNames[i%artistNames.length]);
    function avatarSvg(index){
      const colors=[['#b6d5eb','#3d6d94','#f2cfb4'],['#d8b5c7','#684e75','#efc8aa'],['#bad8c7','#406b61','#f1cfad'],['#aabbd8','#334c70','#e8bea9']][index];
      const svg='<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><rect width="240" height="240" fill="'+colors[0]+'"/><circle cx="120" cy="118" r="82" fill="'+colors[1]+'"/><path d="M20 240Q30 179 120 175T220 240" fill="'+colors[1]+'"/><ellipse cx="120" cy="126" rx="52" ry="62" fill="'+colors[2]+'"/><path d="M59 108Q64 37 124 43Q186 42 181 113Q160 71 135 88Q94 69 59 108" fill="'+colors[1]+'"/><circle cx="102" cy="131" r="3" fill="#3a3a43"/><circle cx="139" cy="131" r="3" fill="#3a3a43"/><path d="M105 157Q121 168 137 157" fill="none" stroke="#b76b6e" stroke-width="3" stroke-linecap="round"/></svg>';
      return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    }
    const profiles=artistNames.map((name,i)=>({
      name,avatar:avatarSvg(i),bio:[
        '画风景、旧房间与缓慢流过的光。喜欢把日常留在画里。',
        '海边、旅行与黄昏的记录。每一张都是寄给未来的明信片。',
        '植物和色彩练习。偶尔也画漫长雨季里的故事。',
        '夜色、街灯与城市角落。收藏那些回家路上的瞬间。'
      ][i],works:works.filter(w=>w.artist===name)
    }));
    const artists=artistNames;
    const types=['单图','多页'];
    const tags=['风景','花卉','夜景','室内'];
    const filter={artists:new Set(artists),types:new Set(types),tags:new Set(),period:'all',from:'',to:'',showHidden:false};
    let view='gallery',selected=0,search='',rail='全部作品',sort='recent',filterOpen=false,filterSection='period';
    let favorites=new Set(),galleryMode='无限滚动',portValue='1919',taskTimer=null,toastTimer=null;
    let theme='dark',artistLayout='grid',galleryScrollY=0,galleryAnchorId=null,restoringGallery=false,streamScrollY=0,restoringStream=false;
    try{theme=localStorage.getItem('pixivtracker-demo-theme')||'dark';artistLayout=localStorage.getItem('pixivtracker-demo-artist-layout')||'grid';galleryScrollY=Number(localStorage.getItem('pixivtracker-demo-gallery-y')||0);galleryAnchorId=Number(localStorage.getItem('pixivtracker-demo-gallery-id')||0)||null;streamScrollY=Number(localStorage.getItem('pixivtracker-demo-stream-y')||0)}catch(_){}
    if(!['dark','light'].includes(theme))theme='dark';
    if(!['grid','row'].includes(artistLayout))artistLayout='grid';
    if(new URL(location.href).searchParams.has('variant')){const u=new URL(location.href);u.searchParams.delete('variant');history.replaceState(null,'',u)}
    const icon={
      search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
      sliders:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="17" r="2" fill="currentColor"/>',
      arrow:'<path d="m15 18-6-6 6-6"/>',
      stream:'<path d="M4 5h16M4 10h16M4 15h16M4 20h16"/>',
      expand:'<path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/>'
    };
    const I=name=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+(icon[name]||'')+'</svg>';
    const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    const workType=w=>w.type?'多页':'单图';
    const workTag=w=>({sun:'风景',sea:'风景',flowers:'花卉',city:'夜景',room:'室内'})[w.kind];
    const workDate=w=>w.id<=4?'2026-09-26':w.id<=8?'2026-09-20':'2026-08-12';
    function matchedWorks(){
      let list=works.filter(w=>(w.title+w.artist).toLowerCase().includes(search.toLowerCase()));
      list=list.filter(w=>filter.artists.has(w.artist)&&filter.types.has(workType(w)));
      if(filter.tags.size) list=list.filter(w=>filter.tags.has(workTag(w)));
      if(!filter.showHidden) list=list.filter(w=>w.id!==12);
      if(rail==='收藏') list=list.filter(w=>favorites.has(w.id));
      if(rail==='最近存入') list=list.filter(w=>w.id<=8);
      if(filter.period==='day') list=list.filter(w=>w.id<=4);
      if(filter.period==='week') list=list.filter(w=>w.id<=8);

      return '<header class="topbar"><button class="brand" id="brandHome" aria-label="回到图库首页" title="回到首页"><span class="brandmark">P</span><span class="brand-word"><span>Pixiv</span>Tracker</span><small>Local archive</small></button><nav class="topnav" aria-label="主导航">'+

    function card(w){

    function gallery(){

        '<div class="filters"><div class="filter-left"><label class="search">'+I('search')+'<input id="search" type="search" placeholder="搜索作品或画师" value="'+esc(search)+'" aria-label="搜索作品或画师"></label></div><div class="filter-right"><button class="softbtn '+(rail==='收藏'?'active':'')+'" data-rail="收藏">♡ 收藏</button><select id="sort" aria-label="排序"><option value="recent" '+(sort==='recent'?'selected':'')+'>最近存入</option><option value="old" '+(sort==='old'?'selected':'')+'>最早存入</option><option value="name" '+(sort==='name'?'selected':'')+'>作品名称</option></select><button class="softbtn filter-open" data-action="open-filter">'+I('sliders')+' 筛选</button></div></div>'+

    function detail(){
      const w=works[selected],list=matchedWorks(),pos=list.findIndex(x=>x.id===w.id),count=Number.parseInt(w.type,10)||1;
      const ordinal=pos<0?selected+1:pos+1,total=pos<0?works.length:list.length;
      return '<main class="detail"><div class="detail-nav"><button class="detail-back" data-action="back-gallery">← 返回</button><div><span>'+ordinal+' / '+total+'</span><button class="softbtn" data-action="open-filter">筛选</button></div></div>'+
        '<section class="detail-head"><div class="detail-title-row"><h1>'+esc(w.title)+'</h1><span class="detail-badge">插画</span>'+(count>1?'<span class="detail-badge">'+count+'P</span>':'')+'</div><div class="detail-meta"><span>画师：<button class="text-link" data-artist="'+esc(w.artist)+'">'+esc(w.artist)+'</button></span><span>发布于 '+workDate(w)+'</span><span>♥ '+(w.id*143)+'</span><span>◉ '+(w.id*1024)+'</span></div><div class="detail-tags"><button class="tag" data-tag-open="'+workTag(w)+'">'+workTag(w)+'</button><span class="tag">插画</span></div></section>'+
        '<div class="detail-actions"><button class="text-link" data-action="external">在 Pixiv 查看 ↗</button><button class="softbtn" data-action="folder" title="打开本地文件夹">📁 本地文件</button><div class="detail-action-right"><button class="softbtn '+(favorites.has(w.id)?'active':'')+'" data-heart="'+w.id+'">'+(favorites.has(w.id)?'♥ 已收藏':'♡ 收藏')+'</button><button class="softbtn" data-action="hide">隐藏</button></div></div>'+
        '<div class="detail-pages">'+Array.from({length:count},(_,i)=>'<div class="detail-page"><img src="'+w.img+'" alt="'+esc(w.title)+' - 第 '+(i+1)+' 页" '+(i?'loading="lazy" style="filter:hue-rotate('+(i*11)+'deg) saturate(.9)"':'')+'><div class="page-num">'+(i+1)+' / '+count+'</div></div>').join('')+'</div>'+
        '<div class="detail-bottom-nav"><button data-step="-1" aria-label="上一件作品">←</button><span>'+ordinal+' / '+total+'</span><button data-step="1" aria-label="下一件作品">→</button></div>'+
        '<p class="detail-caption">这是独立样稿中的示意作品。正式详情页在图片之后显示作品简介，页面结构沿用旧版。</p>'+
        '<div class="detail-side"><button data-step="-1" aria-label="上一件作品">←</button><button data-step="1" aria-label="下一件作品">→</button></div></main>';
    }
    function stream(){
      const list=matchedWorks();
      return '<main class="stream"><div class="stream-head"><div><div class="eyebrow">A continuous gallery</div><h1>顺着喜欢的作品，一直往下看。</h1></div><button class="softbtn" data-view="gallery">返回图库</button></div><div class="stream-list">'+list.map((w,i)=>'<section class="stream-item" id="stream-'+i+'"><div class="stream-label"><b>'+String(i+1).padStart(2,'0')+' / '+list.length+'</b><span>'+esc(w.artist)+'</span><span>·</span><span>'+esc(w.type||'1 页')+'</span></div><div class="stream-figure"><img src="'+w.img+'" alt="'+esc(w.title)+'的示意画面" loading="'+(i<2?'eager':'lazy')+'">'+(w.type?'<img src="'+w.img+'" alt="'+esc(w.title)+'的第二张示意画面" loading="lazy" style="filter:hue-rotate(15deg) saturate(.83)">':'')+'</div><div class="stream-footer"><div><h2>'+esc(w.title)+'</h2><p>这一件看完，直接接着下一件。</p></div><button data-skip="'+(i+1)+'">跳过这件 ↓</button></div></section>').join('')+'</div></main>';
    }
    function artistsPage(){
      return '<main class="subpage"><div class="artists-toolbar"><div><div class="eyebrow">Your artists / 本地追踪</div><h1>喜欢的画师</h1><p class="sublead">头像、简介与已存档的最新作品，离线也能看。</p></div><div class="artist-layout-switch" aria-label="画师排列方式"><button class="'+(artistLayout==='grid'?'active':'')+'" data-artist-layout="grid">▦ 网格</button><button class="'+(artistLayout==='row'?'active':'')+'" data-artist-layout="row">☰ 横列</button></div></div>'+
      '<div class="artists-list '+artistLayout+'">'+profiles.map((a,i)=>'<article class="artist-profile"><div class="artist-identity"><div class="artist-profile-head"><img class="artist-avatar" src="'+a.avatar+'" alt="'+esc(a.name)+'的示意头像"><div><h2>'+esc(a.name)+'</h2><small>已存档 '+a.works.length+' 件 · 正在追踪</small></div></div><p class="artist-bio">'+esc(a.bio)+'</p><button class="artist-open" data-artist="'+esc(a.name)+'">查看全部作品 →</button></div><div class="artist-workarea"><div class="artist-workbar"><span>最新作品</span><div class="strip-nav"><button data-strip-scroll="-1" data-strip-id="'+i+'" aria-label="向左看'+esc(a.name)+'的作品">‹</button><button data-strip-scroll="1" data-strip-id="'+i+'" aria-label="向右看'+esc(a.name)+'的作品">›</button></div></div><div class="artist-recent-strip" data-strip="'+i+'">'+a.works.map(w=>'<button class="artist-work" data-open="'+(w.id-1)+'"><img src="'+w.img+'" alt="'+esc(w.title)+'" loading="lazy"><span>'+esc(w.title)+'</span></button>').join('')+'</div></div></article>').join('')+'</div></main>';
    }
    function settingsPage(){
      return '<main class="settings-page"><div class="eyebrow">Preferences / 本地设置</div><div class="settings-title"><h1>设置</h1><span>视觉样稿 · 不写入真实配置</span></div><div class="settings-stats"><div><strong>4</strong><span>特别关注画师</span></div><div><strong>15,244</strong><span>已记录作品</span></div><div><strong>15,201</strong><span>已下载</span></div></div>'+
      '<section class="settings-card"><div><h2>外观主题</h2><p>选择更适合当前环境的界面。切换后会记住选择。</p></div><div class="theme-choices"><button class="theme-choice '+(theme==='dark'?'active':'')+'" data-theme-pick="dark">◐ 深色</button><button class="theme-choice '+(theme==='light'?'active':'')+'" data-theme-pick="light">☀ 浅色</button></div></section>'+
      '<section class="settings-card"><div><h2>定时检查</h2><p>每 6 小时自动检查画师更新。暂停后只影响下一轮自动检查。</p></div><button class="primarybtn" data-action="check">立即检查更新</button></section>'+
      '<section class="settings-card settings-stack"><div><h2>数据存储目录</h2><p>数据库、令牌与作品图片存放在本地目录。</p></div><div class="path-display">D:\\PixivTracker <span>当前目录示意</span></div><div class="path-structure"><code>data/</code> 数据库和任务记录　 <code>images/</code> 原件与预览</div><button class="softbtn" data-action="path">选择目录…</button></section>'+
      '<section class="settings-card"><div><h2>校验并补全作品信息</h2><p>检查存档缺页与信息缺失；这里点击后只演示任务进度。</p></div><button class="softbtn" data-action="validate">开始校验</button></section>'+
      '<section class="settings-card"><div><h2>画廊翻页</h2><p>按自己的使用习惯，选择连续滚动或页码浏览。</p></div><div class="settings-controls"><select id="galleryMode"><option '+(galleryMode==='无限滚动'?'selected':'')+'>无限滚动</option><option '+(galleryMode==='页码翻页'?'selected':'')+'>页码翻页</option></select><button class="primarybtn" data-action="save-mode">保存</button></div></section>'+
      '<section class="settings-card"><div><h2>端口设置</h2><p>修改端口后，需要重启程序才能生效。</p></div><div class="settings-controls"><input id="portValue" type="number" min="1024" max="65535" value="'+portValue+'" aria-label="端口"><button class="primarybtn" data-action="save-port">保存</button></div></section>'+
      '<section class="settings-card settings-stack"><div><h2>访问地址</h2><p>同一局域网内的手机可通过电脑地址访问。</p></div><div class="address-row">这台电脑 <code>http://localhost:'+portValue+'</code></div><div class="address-row">手机访问 <code>http://电脑的局域网地址:'+portValue+'</code></div></section></main>';
    }
    function chip(label,group,value,active){return '<button class="filter-chip '+(active?'active':'')+'" data-filter-group="'+group+'" data-filter-value="'+esc(value)+'">'+esc(label)+'</button>'}
    function section(name,label,body){
      return '<section class="filter-section"><button class="filter-section-title '+(filterSection===name?'open':'')+'" data-section="'+name+'" aria-expanded="'+(filterSection===name)+'">'+label+'</button>'+(filterSection===name?'<div class="filter-section-body">'+body+'</div>':'')+'</section>';
    }
    function drawFilter(){
      const options=[
        section('artist','画师','<div class="filter-chips">'+chip('全部','artists','all',filter.artists.size===artists.length)+artists.map(a=>chip(a,'artists',a,filter.artists.size!==artists.length&&filter.artists.has(a))).join('')+chip('反选','artists','invert',false)+'</div>'),
        section('type','作品类型','<div class="filter-chips">'+chip('全部','types','all',filter.types.size===types.length)+types.map(t=>chip(t==='单图'?'插画':'多页作品','types',t,filter.types.size!==types.length&&filter.types.has(t))).join('')+chip('反选','types','invert',false)+'</div>'),
        section('tags','标签','<div class="filter-chips">'+chip('全部','tags','all',!filter.tags.size)+tags.map(t=>chip(t,'tags',t,filter.tags.has(t))).join('')+'</div>'),
        section('period','投稿期间','<div class="filter-chips">'+[['all','不限'],['day','24 小时内'],['week','一周内'],['month','一月内'],['custom','指定期间']].map(([v,l])=>chip(l,'period',v,filter.period===v)).join('')+'</div>'+(filter.period==='custom'?'<div class="filter-dates"><input id="dateFrom" type="date" value="'+esc(filter.from)+'" aria-label="起始日期"><span>～</span><input id="dateTo" type="date" value="'+esc(filter.to)+'" aria-label="结束日期"></div>':'')),
        section('display','显示选项','<label class="filter-check"><input id="showHidden" type="checkbox" '+(filter.showHidden?'checked':'')+'> 显示已隐藏作品</label>')
      ];
      const panel=document.getElementById('filterPanel'),at=panel.scrollTop;
      panel.innerHTML='<div class="filter-panel-head"><strong>筛选</strong><button data-action="close-filter" aria-label="关闭筛选">×</button></div><p class="filter-panel-summary">'+esc(filterSummary())+'</p>'+options.join('')+'<div class="filter-panel-foot"><button class="softbtn" data-action="reset-filter">重置筛选</button><button class="primarybtn" data-action="close-filter">查看 '+matchedWorks().length+' 件作品</button></div>';
      panel.scrollTop=at;
    }
    function showFilter(){filterOpen=true;document.getElementById('filterOverlay').classList.remove('hidden');drawFilter()}
    function closeFilter(){filterOpen=false;document.getElementById('filterOverlay').classList.add('hidden')}
    function resetFilter(){filter.artists=new Set(artists);filter.types=new Set(types);filter.tags.clear();filter.period='all';filter.from='';filter.to='';filter.showHidden=false;rail='全部作品';render()}
    function render(){
      document.body.dataset.theme=theme;
      document.getElementById('app').innerHTML=topbar()+({gallery,detail,stream,artists:artistsPage,settings:settingsPage}[view]||gallery)();
      document.title='PixivTracker · 界面样稿';
      if(filterOpen)drawFilter();
    }
    function rememberGalleryPosition(){
      if(view!=='gallery'||restoringGallery)return;
      galleryScrollY=window.scrollY;
      const cards=[...document.querySelectorAll('.card[data-open]')];
      const first=cards.find(card=>card.getBoundingClientRect().bottom>95);
      if(first)galleryAnchorId=Number(first.dataset.open)+1;
      try{localStorage.setItem('pixivtracker-demo-gallery-y',String(galleryScrollY));if(galleryAnchorId)localStorage.setItem('pixivtracker-demo-gallery-id',String(galleryAnchorId))}catch(_){}
    }
    function rememberStreamPosition(){
      if(view!=='stream'||restoringStream)return;
      streamScrollY=window.scrollY;
      const sections=[...document.querySelectorAll('.stream-item')];
      const current=sections.find(section=>section.getBoundingClientRect().bottom>innerHeight*.45);
      const list=matchedWorks();
      if(current&&list[Number(current.id.replace('stream-',''))])selected=list[Number(current.id.replace('stream-',''))].id-1;
      try{localStorage.setItem('pixivtracker-demo-stream-y',String(streamScrollY))}catch(_){}
    }
    function restoreGalleryPosition(focusCurrent){
      const savedY=galleryScrollY;
      requestAnimationFrame(()=>{
        const target=focusCurrent?document.querySelector('.card[data-open="'+selected+'"]'):null;
        if(target)target.scrollIntoView({block:'start',behavior:'instant'});
        else window.scrollTo({top:savedY,behavior:'instant'});
        requestAnimationFrame(()=>{
          restoringGallery=false;
          galleryScrollY=window.scrollY;
          if(focusCurrent)galleryAnchorId=works[selected].id;
          else rememberGalleryPosition();
          try{localStorage.setItem('pixivtracker-demo-gallery-y',String(galleryScrollY));if(galleryAnchorId)localStorage.setItem('pixivtracker-demo-gallery-id',String(galleryAnchorId))}catch(_){}
        });
      });
    }
    function setView(v){
      const previous=view;
      if(previous==='gallery'&&v!=='gallery')rememberGalleryPosition();
      if(previous==='stream'&&v!=='stream')rememberStreamPosition();
      if(v==='gallery')restoringGallery=true;
      view=v;render();
      if(v==='gallery')restoreGalleryPosition(previous==='detail'||previous==='stream');
      else if(v==='stream'){
        restoringStream=true;
        const y=streamScrollY;
        requestAnimationFrame(()=>{window.scrollTo({top:y,behavior:'instant'});requestAnimationFrame(()=>{restoringStream=false;rememberStreamPosition()})});
      }
      else scrollTo(0,0);
    }
    function goHome(){closeFilter();if(view!=='gallery')setView('gallery')}
    function openDetail(i){selected=i;galleryAnchorId=works[i].id;setView('detail')}
    function nextDetail(step){
      const list=matchedWorks(),sequence=list.length?list:works;
      const at=Math.max(0,sequence.findIndex(w=>w.id===works[selected].id));
      selected=sequence[(at+step+sequence.length)%sequence.length].id-1;
      galleryAnchorId=works[selected].id;
      render();scrollTo(0,0);
    }
    function showToast(message){
      const el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');
      clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2800);
    }
    function startDemoTask(label){
      clearInterval(taskTimer);
      let pct=0;const box=document.getElementById('taskProgress');
      document.getElementById('taskLabel').textContent=label;
      box.classList.remove('hidden');
      const tick=()=>{pct=Math.min(100,pct+9);document.getElementById('taskPercent').textContent=pct+'%';document.getElementById('taskFill').style.width=pct+'%';document.getElementById('taskDetail').textContent=pct<25?'正在清点本轮项目':pct<85?'正在处理本轮项目':'正在核对结果';if(pct===100){clearInterval(taskTimer);taskTimer=null;setTimeout(()=>{box.classList.add('hidden');showToast(label+' · 样稿演示完成')},850)}};
      document.getElementById('taskPercent').textContent='0%';document.getElementById('taskFill').style.width='0%';document.getElementById('taskDetail').textContent='正在清点本轮项目';
      taskTimer=setInterval(tick,240);
    }
    function toggleFilter(group,value){
      if(group==='period'){filter.period=value}
      else if(group==='tags'){if(value==='all')filter.tags.clear();else filter.tags.has(value)?filter.tags.delete(value):filter.tags.add(value)}
      else{const pool=group==='artists'?artists:types,set=filter[group];
        if(value==='all')filter[group]=new Set(pool);
        else if(value==='invert')filter[group]=new Set(pool.filter(x=>!set.has(x)));
        else set.has(value)?set.delete(value):set.add(value);
      }
      render();
    }
    let stripDrag=null,suppressWorkClickUntil=0;
    document.addEventListener('click',e=>{
      const b=e.target.closest('button,[data-open]');
      if(e.target.id==='filterOverlay'){closeFilter();return}
      if(!b)return;
      if(b.classList.contains('artist-work')&&Date.now()<suppressWorkClickUntil){e.preventDefault();return}
      if(b.id==='brandHome'){goHome();return}
      if(b.dataset.heart){const id=Number(b.dataset.heart);favorites.has(id)?favorites.delete(id):favorites.add(id);render();return}
      if(b.dataset.open){openDetail(Number(b.dataset.open));return}
      if(b.dataset.view){setView(b.dataset.view);return}
      if(b.dataset.step){nextDetail(Number(b.dataset.step));return}
      if(b.dataset.rail){rail=b.dataset.rail;setView('gallery');return}
      if(b.dataset.artist){filter.artists=new Set([b.dataset.artist]);rail='全部作品';galleryScrollY=0;setView('gallery');return}
      if(b.dataset.artistLayout){
        const y=window.scrollY;artistLayout=b.dataset.artistLayout;
        try{localStorage.setItem('pixivtracker-demo-artist-layout',artistLayout)}catch(_){}
        render();requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}));return;
      }
      if(b.dataset.stripScroll){
        const strip=document.querySelector('.artist-recent-strip[data-strip="'+b.dataset.stripId+'"]');
        strip?.scrollBy({left:Number(b.dataset.stripScroll)*330,behavior:'smooth'});return;
      }
      if(b.dataset.themePick){
        theme=b.dataset.themePick;
        try{localStorage.setItem('pixivtracker-demo-theme',theme)}catch(_){}
        const y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}));return;
      }
      if(b.dataset.tagOpen){filter.tags=new Set([b.dataset.tagOpen]);rail='全部作品';galleryScrollY=0;setView('gallery');return}
      if(b.dataset.section){filterSection=filterSection===b.dataset.section?'':b.dataset.section;drawFilter();return}
      if(b.dataset.filterGroup){toggleFilter(b.dataset.filterGroup,b.dataset.filterValue);return}
      if(b.dataset.skip){document.getElementById('stream-'+b.dataset.skip)?.scrollIntoView({behavior:'smooth'});return}
      const a=b.dataset.action;
      if(a==='open-filter')showFilter();
      if(a==='close-filter')closeFilter();
      if(a==='reset-filter')resetFilter();
      if(a==='back-gallery')setView('gallery');
      if(a==='external'||a==='folder'||a==='hide'||a==='path')showToast('这是视觉样稿，不会操作真实作品、目录或账号。');
      if(a==='check')startDemoTask('检查画师更新');
      if(a==='validate')startDemoTask('校验本地存档');
      if(a==='save-mode'){galleryMode=document.getElementById('galleryMode').value;showToast('样稿中已选择 '+galleryMode+'，真实设置未改动。')}
      if(a==='save-port'){portValue=document.getElementById('portValue').value;render();showToast('样稿端口已更新，真实设置未改动。')}
    });
    document.addEventListener('pointerdown',e=>{
      const strip=e.target.closest('.artists-list.row .artist-recent-strip');
      if(!strip||e.pointerType==='touch')return;
      stripDrag={strip,pointerId:e.pointerId,startX:e.clientX,startLeft:strip.scrollLeft,moved:false};
    });
    document.addEventListener('pointermove',e=>{
      if(!stripDrag||e.pointerId!==stripDrag.pointerId)return;
      const delta=e.clientX-stripDrag.startX;
      if(Math.abs(delta)>5){stripDrag.moved=true;stripDrag.strip.classList.add('dragging')}
      stripDrag.strip.scrollLeft=stripDrag.startLeft-delta;
    });
    document.addEventListener('pointerup',e=>{
      if(!stripDrag||e.pointerId!==stripDrag.pointerId)return;
      if(stripDrag.moved)suppressWorkClickUntil=Date.now()+350;
      stripDrag.strip.classList.remove('dragging');stripDrag=null;
    });
    document.addEventListener('pointercancel',()=>{if(stripDrag){stripDrag.strip.classList.remove('dragging');stripDrag=null}});
    document.addEventListener('dragstart',e=>{if(e.target.closest('.artist-recent-strip'))e.preventDefault()});
    window.addEventListener('scroll',()=>{if(view==='gallery')rememberGalleryPosition();if(view==='stream')rememberStreamPosition()},{passive:true});
    document.addEventListener('input',e=>{
      if(e.target.id==='search'){search=e.target.value;const at=e.target.selectionStart;render();const s=document.getElementById('search');s.focus();s.setSelectionRange(at,at)}
      if(e.target.id==='dateFrom'){filter.from=e.target.value;render()}
      if(e.target.id==='dateTo'){filter.to=e.target.value;render()}
    });
    document.addEventListener('change',e=>{
      if(e.target.id==='sort'){sort=e.target.value;render()}
      if(e.target.id==='showHidden'){filter.showHidden=e.target.checked;render()}
      if(e.target.id==='dateFrom'){filter.from=e.target.value;render()}
      if(e.target.id==='dateTo'){filter.to=e.target.value;render()}
    });
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'){closeFilter();return}
      if(e.target.matches('input,textarea,select,[contenteditable]'))return;
      if(view==='detail'&&e.key==='ArrowLeft')nextDetail(-1);
      else if(view==='detail'&&e.key==='ArrowRight')nextDetail(1);
    });
    document.addEventListener('keydown',e=>{const card=e.target.closest?.('[data-open]');if(card&&e.key==='Enter')openDetail(Number(card.dataset.open))});
    render();
    if(galleryScrollY)requestAnimationFrame(()=>window.scrollTo({top:galleryScrollY,behavior:'instant'}));
  </script>
</body>
</html>
